# tmux configuration for remote servers and high-latency SSH connections.

# Terminal capabilities and remote clipboard support.
set -g default-terminal 'tmux-256color'
# Discard entries appended by older revisions before adding reload-safe slots.
set -su terminal-features
set -s terminal-features[100] 'xterm-256color:RGB:clipboard'
set -s terminal-features[101] 'tmux-256color:RGB:clipboard'
set -s set-clipboard external
set -s copy-command 'tmux load-buffer -w -'

# tmux 3.4 uses escape-time while parsing terminal replies. Keep the full
# default window so OSC 10/11 responses split by SSH are not sent to the shell.
set -s escape-time 500

# Capture wheel events so they enter tmux copy mode instead of reaching an
# application as Up/Down keys. Disable tmux drag selection to avoid round-trip
# redraws over SSH; Windows Terminal can select locally with Shift + drag.
set -g mouse on
unbind -T root MouseDrag1Pane
unbind -T root MouseDragEnd1Pane
unbind -T copy-mode MouseDrag1Pane
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDrag1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

# Temporarily disable mouse reporting when unmodified local selection is more
# convenient. Prefix + M toggles back to the scrollback-friendly default.
bind M if-shell -F '#{mouse}' {
    set-option -g mouse off
    display-message 'Mouse off: drag selects locally; prefix + M restores scrolling'
} {
    set-option -g mouse on
    display-message 'Mouse on: wheel scrolls history; Shift + drag selects locally'
}

set -g focus-events off
setw -g aggressive-resize off

# Session and history behavior.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g status-interval 30
set -g display-time 2000
set -g repeat-time 500
set -g allow-rename off

# Windows Terminal cannot display tmux's remote history in its native
# scrollbar. tmux 3.6+ can render a stable one-column scrollbar for each pane;
# older servers skip this block and retain full configuration compatibility.
if-shell -F '#{m/r:^(3\.([6-9]|[1-9][0-9]+)|([4-9]|[1-9][0-9]+)\.),#{version}}' {
    set-option -g pane-scrollbars on
    set-option -g pane-scrollbars-position right
    set-option -g pane-scrollbars-style 'fg=#89b4fa,bg=#313244,width=1,pad=0'
}

# Forward the active pane's application title to the outer terminal. Put the
# application-provided text first so it remains visible in narrow tab labels.
set -g set-titles on
set -g set-titles-string '#{pane_title} | #{host_short} | #S:#I.#P'

# Vi copy mode. Selection is copied through OSC 52 to the attached terminal.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Catppuccin Mocha colors without a runtime theme plugin.
set -g status-style 'fg=#cdd6f4,bg=#181825'
set -g message-style 'fg=#1e1e2e,bg=#89b4fa'
set -g message-command-style 'fg=#1e1e2e,bg=#89b4fa'
set -g mode-style 'fg=#1e1e2e,bg=#a6e3a1'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'

set -g status-left-length 30
set -g status-left '#[fg=#1e1e2e,bg=#a6e3a1,bold] #S #[default] '
set -g window-status-separator ''
set -g window-status-format '#[fg=#a6adc8,bg=#181825] #I:#W#F '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W#F '
set -g status-right-length 100
set -g status-right '#[fg=#f5e0dc]#{pane_current_path} #[fg=#45475a]| #[fg=#f9e2af]#{pane_current_command} #[fg=#45475a]| #[fg=#74c7ec]%m-%d %H:%M '
