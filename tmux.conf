# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'o0th/tmux-nova'

# Nova theme and compact status segments.
set -g @nova-nerdfonts true
set -g @nova-nerdfonts-left ''
set -g @nova-nerdfonts-right ''
set -g @nova-pane '#I #W'

set -g @nova-segment-session '#S'
set -g @nova-segment-session-colors '#{?client_prefix,#ffb86c,#50fa7b} #282a36'
set -g @nova-segment-directory '#{b:pane_current_path}'
set -g @nova-segment-directory-colors '#8be9fd #282a36'
set -g @nova-segment-application '#{pane_current_command}'
set -g @nova-segment-application-colors '#ff79c6 #282a36'
set -g @nova-segment-time '%m-%d %H:%M'
set -g @nova-segment-time-colors '#bd93f9 #282a36'

set -g @nova-rows 0
set -g @nova-segments-0-left 'session'
set -g @nova-segments-0-right 'directory application time'

# Terminal and clipboard support.
set -g default-terminal 'tmux-256color'
# Fixed array slots keep repeated source-file reloads idempotent.
set -g terminal-features[100] 'xterm-256color:RGB'
set -g terminal-features[101] 'tmux-256color:RGB'
set -s set-clipboard on
set -g set-titles on
set -g set-titles-string '#T'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Load TPM when present so a missing plugin checkout does not break startup.
if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'

# Keep delayed OSC 10/11 replies inside tmux's parser window over SSH.
set -s escape-time 500

# Keep the status line focused on session, work context, and time.
set -g status-left-length 30
set -g status-right-length 100
