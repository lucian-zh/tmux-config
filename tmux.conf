# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'

# Catppuccin theme and compact status modules.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_session_icon ''
set -g @catppuccin_directory_icon ''
set -g @catppuccin_application_icon ''
set -g @catppuccin_date_time_icon ''
set -g @catppuccin_date_time_text ' %m-%d %H:%M'

# Terminal and clipboard support.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',tmux-256color:RGB'
set -s set-clipboard on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Load TPM when present so a missing plugin checkout does not break startup.
if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'

# Keep delayed OSC 10/11 replies inside tmux's parser window over SSH.
set -s escape-time 500

# Keep the status line focused on session, work context, and time.
set -g status-left-length 30
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_directory}'
set -ag status-right '#{E:@catppuccin_status_application}'
set -ag status-right '#{E:@catppuccin_status_date_time}'
